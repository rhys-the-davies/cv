  <style>
    :root {
      --text: #1a1a1a;
      --text-muted: #555;
      --border: #e0e0e0;
      --font-heading: 'Atkinson Hyperlegible', sans-serif;
      --font-body: 'Lato', sans-serif;
      --pad-h: 80px;
      --sidebar-w: 240px;
      --sidebar-gap: 32px;
      --max-w: 940px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 15px; }
    body { font-family: var(--font-body); color: var(--text); background: #e0e0e0; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* PAGE */
    .page { max-width: var(--max-w); margin: 56px auto; background: #fff; box-shadow: 0 2px 32px rgba(0,0,0,0.12); }

    /* HEADER */
    .header { padding: 52px var(--pad-h) 36px; border-bottom: 1px solid var(--border); }
    .header-top { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 10px; }
    .header-name { font-family: var(--font-heading); font-size: 2.1rem; font-weight: 700; letter-spacing: -0.5px; line-height: 1; }
    .header-tagline { font-family: var(--font-body); font-size: 0.93rem; color: var(--text-muted); font-weight: 300; }
    .header-contact { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px; display: flex; align-items: center; flex-wrap: wrap; font-weight: 400; }
    .header-contact .sep { margin: 0 8px; color: #ccc; }
    .header-links { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; font-size: 0.85rem; }
    .header-links a { display: flex; align-items: center; gap: 6px; color: var(--text-muted); font-weight: 400; }
    .link-badge { width: 20px; height: 20px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .link-badge svg { width: 11px; height: 11px; }

    /* PROFILE — full width */
    .profile-wrap { padding: 40px var(--pad-h) 36px; border-bottom: 1px solid var(--border); }
    .section-heading { font-family: var(--font-heading); font-size: 1.35rem; font-weight: 400; margin-bottom: 16px; }
    .profile-wrap p { font-size: 0.93rem; line-height: 1.78; font-weight: 400; }
    .profile-wrap p strong { font-weight: 700; }

    /* FIRST JOB — full width, Experience heading here */
    .first-job-wrap { padding: 36px var(--pad-h) 0; }
    .first-job-wrap .section-heading { margin-bottom: 22px; }

    /* SPLIT — jobs left, sidebar right */
    .split {
      display: grid;
      grid-template-columns: 1fr var(--sidebar-w);
      gap: 0 var(--sidebar-gap);
      padding: 0 var(--pad-h);
      align-items: start;
    }
    .jobs-col {
      padding: 28px 0 56px;
      border-right: 1px solid var(--border);
      padding-right: var(--sidebar-gap);
    }
    .sidebar-col {
      padding: 28px 0 56px;
    }

    /* JOBS */
    .job { margin-bottom: 32px; padding-bottom: 32px; border-bottom: 1px solid var(--border); break-inside: avoid; page-break-inside: avoid; }
    .job:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .job.first-job { padding-bottom: 32px; border-bottom: 1px solid var(--border); margin-bottom: 0; break-inside: avoid; page-break-inside: avoid; }
    .job-dateline { font-size: 0.72rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 8px; font-family: var(--font-body); }
    .job-header { display: flex; align-items: center; gap: 13px; margin-bottom: 11px; }
    .job-logo { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 0.62rem; font-weight: 700; color: #fff; text-transform: lowercase; overflow: hidden; font-family: var(--font-body); }
    .job-logo img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .job-title-line { font-family: var(--font-heading); font-size: 1.05rem; font-weight: 700; line-height: 1.3; }
    .job-desc { font-size: 0.88rem; line-height: 1.75; color: var(--text-muted); margin-bottom: 12px; font-weight: 400; }
    .job-bullets { list-style: disc; padding-left: 20px; }
    .job-bullets li { font-size: 0.88rem; line-height: 1.75; margin-bottom: 5px; font-weight: 400; }

    /* SIDEBAR */
    .sidebar-section { margin-bottom: 26px; }
    .sidebar-heading { font-family: var(--font-heading); font-size: 1rem; font-weight: 700; margin-bottom: 10px; }
    .skill-row { font-size: 0.8rem; line-height: 1.85; color: var(--text-muted); font-weight: 400; }
    .skill-row strong { color: var(--text); font-weight: 700; font-family: var(--font-body); }
    .tool-list { display: flex; flex-direction: column; gap: 9px; }
    .tool-item { display: flex; align-items: center; gap: 10px; font-size: 0.88rem; font-weight: 400; }
    .tool-icon-wrap { width: 26px; height: 26px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .tool-icon-wrap svg { width: 26px; height: 26px; }
    .cert-item { margin-bottom: 11px; }
    .cert-provider { font-size: 0.8rem; font-weight: 700; font-family: var(--font-heading); }
    .cert-name { font-size: 0.78rem; color: var(--text-muted); line-height: 1.5; font-weight: 400; }
    .edu-item { display: flex; gap: 10px; margin-bottom: 14px; }
    .edu-icon { width: 34px; height: 34px; border-radius: 50%; background: #dbeafe; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 0.6rem; font-weight: 700; color: #1d4ed8; font-family: var(--font-body); }
    .edu-degree { font-size: 0.8rem; font-weight: 700; line-height: 1.45; font-family: var(--font-heading); }
    .edu-uni { font-size: 0.76rem; color: var(--text-muted); margin-top: 2px; font-weight: 400; }

    .footer { text-align: center; padding: 24px; font-size: 0.88rem; font-weight: 400; color: var(--text-muted); border-top: 1px solid var(--border); font-family: var(--font-body); }

    /* PRINT */
    @media print {
      @page { size: A4; margin: 14mm 12mm; }
      html, body { font-size: 11.5px; background: #fff; }
      .page { max-width: 100%; margin: 0; box-shadow: none; }
      :root { --pad-h: 0px; --sidebar-gap: 24px; }
      .header { padding: 0 0 20px; }
      .profile-wrap { padding: 20px 0 18px; }
      .first-job-wrap { padding: 18px 0 0; }
      .split { padding: 0; }
      .jobs-col { padding-top: 18px; padding-bottom: 0; }
      .sidebar-col { padding-top: 18px; padding-bottom: 0; }
      .job {
        break-inside: avoid;
        page-break-inside: avoid;
        margin-bottom: 18px;
        padding-bottom: 18px;
      }
      .job.first-job { margin-bottom: 0; padding-bottom: 18px; }
      .footer { display: none; }
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    }

    /* RESPONSIVE */
    @media (max-width: 720px) {
      :root { --pad-h: 28px; }
      .split { grid-template-columns: 1fr; }
      .jobs-col { border-right: none; padding-right: 0; border-bottom: 1px solid var(--border); }
      .sidebar-col { padding-top: 32px; }
    }
  </style>
</head>

function badge(type, href, label) {
  const ic = LI[type];
  return `<a href="${href}"><span class="link-badge" style="background:${ic.bg}">${ic.svg}</span>${label}</a>`;
}

function jobHtml(job, extraClass) {
  const logo = job.logoFile
    ? `<img src="logos/${job.logoFile}" alt="${job.company}">`
    : job.logoFallback;
  return `<div class="job${extraClass ? ' '+extraClass : ''}">
    <div class="job-dateline">${job.start} – ${job.end} | ${job.location}</div>
    <div class="job-header">
      <div class="job-logo" style="${job.logoFile ? '' : 'background:'+job.logoColor}">${logo}</div>
      <div class="job-title-line">${job.title} | ${job.company}</div>
    </div>
    ${job.description ? `<p class="job-desc">${job.description}</p>` : ''}
    <ul class="job-bullets">${job.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>
  </div>`;
}

function render() {
  const d = CV;
  const c = d.contact;

  const profileHtml = d.profile
    .replace('5+ years of experience', '<strong>5+ years of experience</strong>')
    .replace(' leader ', ' <strong>leader</strong> ')
    .replace(' maker ', ' <strong>maker</strong> ')
    .replace(' advocate ', ' <strong>advocate</strong> ');

  const firstJob = d.experience[0];
  const restJobs = d.experience.slice(1);

  const skillsHtml = d.sidebar.skills.map(s =>
    `<div class="skill-row"><strong>${s.label}:</strong> ${s.items.join(' | ')}</div>`
  ).join('');

  const toolsHtml = d.sidebar.tools.map(t =>
    `<div class="tool-item"><div class="tool-icon-wrap">${ICONS[t.icon]||''}</div>${t.name}</div>`
  ).join('');

  const certsHtml = d.sidebar.certifications.map(cert =>
    `<div class="cert-item"><div class="cert-provider">${cert.provider}</div><div class="cert-name">${cert.name}</div></div>`
  ).join('');

  const eduHtml = d.sidebar.education.map(e => {
    const ini = e.institution.split(' ').map(w=>w[0]).join('').slice(0,2);
    return `<div class="edu-item">
      <div class="edu-icon">${ini}</div>
      <div><div class="edu-degree">${e.degree}</div><div class="edu-uni">${e.institution}</div></div>
    </div>`;
  }).join('');

  document.getElementById('cv-root').innerHTML = `
    <div class="header">
      <div class="header-top">
        <span class="header-name">${d.name}</span>
        <span class="header-tagline">| ${d.tagline}</span>
      </div>
      <div class="header-contact">
        <span>${c.email}</span><span class="sep">|</span>
        <span>${c.phone}</span><span class="sep">|</span>
        <a href="${c.website}">${c.website}</a><span class="sep">|</span>
      </div>
      <div class="header-links">
        ${badge('linkedin','https://linkedin.com'+c.linkedin, c.linkedin)}
        ${badge('github','https://github.com'+c.github, c.github)}
        ${badge('blog', c.portfolio, c.blog)}
        <a href="${c.portfolio}">${c.portfolio}</a>
      </div>
    </div>

    <div class="profile-wrap">
      <div class="section-heading">Profile</div>
      <p>${profileHtml}</p>
    </div>

    <div class="first-job-wrap">
      <div class="section-heading">Experience</div>
      ${jobHtml(firstJob, 'first-job')}
    </div>

    <div class="split">
      <div class="jobs-col">
        ${restJobs.map(j => jobHtml(j)).join('')}
      </div>
      <div class="sidebar-col">
        <div class="sidebar-section">
          <div class="sidebar-heading">Key skills and knowledge</div>
          ${skillsHtml}
        </div>
        <div class="sidebar-section">
          <div class="sidebar-heading">Tool proficiencies</div>
          <div class="tool-list">${toolsHtml}</div>
        </div>
        <div class="sidebar-section">
          <div class="sidebar-heading">Certifications</div>
          ${certsHtml}
        </div>
        <div class="sidebar-section">
          <div class="sidebar-heading">Education</div>
          ${eduHtml}
        </div>
      </div>
    </div>

    <div class="footer">Let's work together on your next product, references upon request 🚀</div>
  `;
}

render();
</script>
